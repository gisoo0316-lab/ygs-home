<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YGS 양기수 대표 명함</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#ECE8DF;font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;color:#1B2A4A;display:flex;justify-content:center;padding:16px}
.wrap{width:100%;max-width:380px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 6px 24px rgba(27,42,74,.15)}
.top{position:relative;width:100%;aspect-ratio:1245/1240;background:#EDE7DA;overflow:hidden}
.top img.photo{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
.top svg{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:86%}
.hint{position:absolute;top:14px;left:0;right:0;text-align:center;font-size:11px;color:#8A93A6}
.card{position:relative;margin:-22px 14px 0;background:#1B2A4A;border-radius:14px;padding:16px 18px 14px;color:#fff}
.card .head{display:flex;justify-content:space-between;align-items:flex-start}
.name{font-size:17px;font-weight:700;letter-spacing:.5px;white-space:nowrap}
.name .en{margin-left:8px;font-size:11px;font-weight:400;letter-spacing:.8px;color:#B9C1D2}
.co{font-size:12px;font-weight:400;color:#C9D0DE;white-space:nowrap;margin-bottom:6px;letter-spacing:.3px}
.job{margin-top:8px;font-size:13px;color:#fff;font-weight:400}
.role{margin-top:4px;font-size:12px;color:#B9C1D2}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips span{white-space:nowrap;font-size:11px;color:#fff;background:rgba(255,255,255,.14);border-radius:6px;padding:5px 8px}
.list{background:#fff;padding:10px 20px 8px}
.row{display:flex;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid #E8EBF0;font-size:13px;line-height:1.45}
.row:last-child{border-bottom:none}
.k{flex:none;width:74px;white-space:nowrap;color:#8A93A6;font-size:12px}
.v{flex:1;text-align:right;font-weight:400;color:#1B2A4A;word-break:keep-all}
a{color:inherit;text-decoration:none}
.cta{padding:6px 20px 22px;display:flex;gap:10px}
.btn{flex:1;display:block;text-align:center;background:#1B2A4A;color:#fff;font-weight:400;font-size:14px;padding:14px 0;border-radius:10px;;border:1px solid #1B2A4A}
.btn.line{background:#fff;color:#1B2A4A}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img class="photo" src="img/yang-photo.jpg" alt="양기수 ㈜와이지에스 대표이사">
  </div>
    <div class="card">
      <div class="co">㈜와이지에스</div>
      <div class="name">양기수<span class="en">YANG GI SOO</span></div>
      <div class="role">대표이사</div>
      <div class="chips"><span>분양대행</span><span>시장조사 보고서</span><span>미분양 전략 보고서</span></div>
    </div>
  <div class="list">
    <div class="row"><div class="k">주소</div><div class="v">전주시 만성로 150</div></div>
    <div class="row"><div class="k">휴대전화</div><div class="v"><a href="tel:01067973456">010-6797-3456</a></div></div>
    <div class="row"><div class="k">이메일</div><div class="v">ygsno1@naver.com</div></div>
    <div class="row"><div class="k">홈페이지</div><div class="v"><a href="https://ygs-home.co.kr">ygs-home.co.kr</a></div></div>
  </div>
  <div class="cta"><a class="btn" href="tel:01067973456">전화 걸기</a><a class="btn line" href="#">카카오톡 상담</a></div>
</div>
</body>
</html>
